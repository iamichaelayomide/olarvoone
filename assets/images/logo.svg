<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer rounded ring -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#primary-grad)" />
    <!-- Dynamic AI wave / O-shape -->
    <path d="M30 14 C21.16 14 14 21.16 14 30 C14 38.84 21.16 46 30 46 C38.84 46 46 38.84 46 30" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Sparkle / One node -->
    <circle cx="30" cy="30" r="5" fill="url(#accent-grad)" filter="url(#glow)" />
    <!-- Growth spark accent -->
    <path d="M42 16 L45 22 L51 25 L45 28 L42 34 L39 28 L33 25 L39 22 Z" fill="#FBBF24" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(85, 48)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="currentColor" letter-spacing="-0.03em">
      olarvo<tspan fill="url(#primary-grad)">one</tspan>
    </text>
  </g>
</svg>
